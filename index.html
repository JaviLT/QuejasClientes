<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>(function(){try{if(localStorage.getItem('zx-tema')==='oscuro')document.documentElement.setAttribute('data-tema','oscuro');}catch(e){}})();</script>
<title>Quejas de Clientes — Iniciar sesión</title>
<link rel="icon" href="assets/img/logo-zx.png" />
<link rel="stylesheet" href="assets/css/estilos.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="zx-login-envoltura">
    <div class="zx-login-tarjeta">
      <img class="zx-login-logo" src="assets/img/logo-zx.png" alt="ZX" />
      <h1>Quejas de Clientes</h1>
      <p class="sub">Inicia sesión con tu usuario de área.</p>

      <div id="zx-mensaje" class="zx-mensaje zx-mensaje-error zx-oculto"></div>

      <form id="zx-form-login">
        <div class="zx-campo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" autocomplete="username" placeholder="COMERCIAL / CALIDAD / CEDIS" autocapitalize="characters" required />
        </div>
        <div class="zx-campo" style="margin-top:12px;">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required />
        </div>
        <button type="submit" id="zx-btn-entrar" class="zx-btn zx-btn-primario">Entrar</button>
      </form>
    </div>
  </div>

  <footer class="zx-pie" style="color: var(--zx-texto-suave); text-align:center; padding: 16px;">Quejas de Clientes — Zubex</footer>

  <script type="module" src="assets/js/login.js"></script>
</body>
</html>
