<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>(function(){try{if(localStorage.getItem('zx-tema')==='oscuro')document.documentElement.setAttribute('data-tema','oscuro');}catch(e){}})();</script>
<title>Quejas de Clientes — Acceso de pruebas</title>
<link rel="icon" href="assets/img/logo-zx.png" />
<link rel="stylesheet" href="assets/css/estilos.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha384-BWcjm9OdFth9TbhCxZPdm+gAOUMAzQy9nmTs12ioXdCcbVnJaPMn+fMUoQCLt60R" crossorigin="anonymous"></script>
</head>
<body class="zx-pagina-login">
  <div class="zx-login-envoltura">
    <div class="zx-login-tarjeta">
      <div class="zx-login-marca">
        <img class="zx-login-logo" src="assets/img/logo-zx.png" alt="ZX" />
        <h1>Quejas de Clientes</h1>
        <p class="zx-login-sub">Acceso de pruebas (usuario y contraseña)</p>
      </div>

      <div id="zx-mensaje" class="zx-mensaje zx-oculto"></div>

      <form id="zx-form-login" autocomplete="off">
        <div class="zx-campo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" autocomplete="off" placeholder="COMERCIAL / CALIDAD / CEDIS" autocapitalize="characters" required />
        </div>
        <div class="zx-campo" style="margin-top:12px;">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required />
        </div>
        <button type="submit" id="zx-btn-entrar" class="zx-btn zx-btn-primario">Entrar</button>
      </form>
      <p class="zx-login-enlace"><a href="login.html">← Entrar con Microsoft</a></p>
    </div>
  </div>

  <footer class="zx-pie" style="color: var(--zx-texto-suave); text-align:center; padding: 10px 16px 16px;">Quejas de Clientes — Zubex</footer>

  <script type="module" src="assets/js/login-pruebas.js"></script>
</body>
</html>
