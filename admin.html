<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>(function(){try{if(localStorage.getItem('zx-tema')==='oscuro')document.documentElement.setAttribute('data-tema','oscuro');}catch(e){}})();</script>
<title>Quejas de Clientes — Administrador</title>
<link rel="icon" href="assets/img/logo-zx.png" />
<link rel="stylesheet" href="assets/css/estilos.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <header id="zx-encabezado"></header>

  <main class="zx-contenedor">
    <div id="zx-mensaje" class="zx-mensaje zx-oculto"></div>

    <div class="zx-tarjeta">
      <h2>Quejas abiertas <span id="c-abiertas" class="zx-contador">0</span></h2>
      <p class="zx-fila-meta" style="margin-top:-6px;">Todavía en proceso. Da clic en "Ver tiempos" para ver cuánto duró cada etapa.</p>
      <div id="lista-abiertas"></div>
    </div>

    <div class="zx-tarjeta">
      <h2>Quejas cerradas <span id="c-cerradas" class="zx-contador">0</span></h2>
      <p class="zx-fila-meta" style="margin-top:-6px;">Cerradas o rechazadas, sin importar en qué paso terminaron.</p>
      <div id="lista-cerradas"></div>
    </div>
  </main>

  <footer class="zx-pie">Quejas de Clientes — Zubex</footer>

  <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
